name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A PR that changes the app is a release, or merging it publishes nothing — the Release
  # workflow only acts on a version without a tag. Fails the PR when the bump or its
  # CHANGELOG heading is missing. Docs, tests and CI changes are exempt.
  version-bump:
    name: Version bump
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    steps:
      # Full history and tags: the check diffs against the base branch and refuses a
      # version that is already tagged.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0

      - name: Check the PR bumps the version when it changes the app
        run: .github/scripts/check-version-bump.sh "origin/${{ github.base_ref }}"

  build-and-test:
    name: Build and test
    runs-on: macos-15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Show toolchain
        run: |
          swift --version
          sw_vers

      - name: Build
        run: |
          swift build -c release --product Folio
          swift build -c release --product folio-register

      # Some suites drive AppKit and WebKit directly. If a runner ever lacks the GUI
      # session they need, set FOLIO_SKIP_UI_TESTS=1 to skip just those.
      - name: Test
        run: swift test

      - name: Assemble the app bundle
        run: ./build.sh

      - name: Check the bundle
        run: |
          test -x build/Folio.app/Contents/MacOS/Folio
          test -x build/Folio.app/Contents/MacOS/folio-register
          test -f build/Folio.app/Contents/Resources/mermaid.min.js
          test -f build/Folio.app/Contents/Resources/AppIcon.icns
          plutil -lint build/Folio.app/Contents/Info.plist
          codesign --verify --verbose=2 build/Folio.app

      - name: Package for download
        run: ditto -c -k --keepParent build/Folio.app Folio.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Folio.app
          path: Folio.app.zip
          if-no-files-found: error
